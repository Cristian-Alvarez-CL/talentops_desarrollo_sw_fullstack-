services:
  db:
    image: mysql
    container_name: mysql_db_ttops
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "root-password"
      MYSQL_DATABASE: "ttops_node_db"
      MYSQL_USER: "user-ttops"
      MYSQL_PASSWORD: "password-ttops"
    volumes:
      - ./mysql_data:/var/lib/mysql 
    ports:
      - "3306:3306"

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"